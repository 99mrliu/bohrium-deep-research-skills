<svg xmlns="http://www.w3.org/2000/svg" width="794" height="982" viewBox="0 0 794 982">
<rect width="794" height="982" fill="#ffffff" stroke="#cccccc"/>
<text x="40" y="30" font-size="11" fill="#888888" font-family="monospace">第 1 页 / 共 2 页</text>
<text x="40" y="62" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace"># 高效稳定钙钛矿光伏组件封装技术——成果转化推介书</text>
<text x="40" y="84" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace"></text>
<text x="40" y="106" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">&gt; 合成示例稿件，数据均为虚构，仅用于演示交付流水线。</text>
<text x="40" y="128" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace"></text>
<text x="40" y="150" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">## 一、成果概述</text>
<text x="40" y="172" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace"></text>
<text x="40" y="194" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">本成果为一种**高效稳定钙钛矿光伏组件封装技术**，面向产业化落地。实验室</text>
<text x="40" y="216" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">小面积器件效率达到 26.1%，经第三方机构复核；中试线组件（30 cm × 30 cm）</text>
<text x="40" y="238" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">效率 19.8%，通过 85 ℃ / 85% RH 双八五老化测试 1000 小时，效率保持率</text>
<text x="40" y="260" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">94%。</text>
<text x="40" y="282" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace"></text>
<text x="40" y="304" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">核心创新点：</text>
<text x="40" y="326" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace"></text>
<text x="40" y="348" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">- **界面钝化分子设计**：自组装单分子层（SAM）配方，抑制界面非辐射复合；</text>
<text x="40" y="370" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">- **双层复合封装结构**：无机阻水层 + 有机缓冲层，水汽透过率降低两个数量级；</text>
<text x="40" y="392" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">- **低温固化工艺**：固化温度 ≤ 120 ℃，兼容柔性基底与现有产线改造。</text>
<text x="40" y="414" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace"></text>
<text x="40" y="436" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">## 二、知识产权与成熟度</text>
<text x="40" y="458" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace"></text>
<text x="40" y="480" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">| 维度 | 现状 | 说明 |</text>
<text x="40" y="502" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">|---|---|---|</text>
<text x="40" y="524" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">| 发明专利 | 已授权 6 项 | 覆盖配方、结构、工艺三个环节 |</text>
<text x="40" y="546" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">| PCT 申请 | 2 项进入国家阶段 | 美、欧、日布局 |</text>
<text x="40" y="568" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">| 技术成熟度 | TRL 6 | 中试线连续运行 3 个月 |</text>
<text x="40" y="590" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">| 样品状态 | 可提供 | 30 cm × 30 cm 组件样品 20 片 |</text>
<text x="40" y="612" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace"></text>
<text x="40" y="634" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">## 三、市场与竞争分析</text>
<text x="40" y="656" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace"></text>
<text x="40" y="678" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">1. **目标市场**：分布式光伏 BIPV、轻质组件、室内弱光供电三个细分场景；</text>
<text x="40" y="700" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">2. **市场规模**：按行业公开数据估算，2028 年目标细分市场合计约 300 亿元；</text>
<text x="40" y="722" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">3. **竞争格局**：国内已有 4 家企业进入中试阶段，本成果在**稳定性指标**上处于第一梯队，在**封装成本**上低约 15%。</text>
<text x="40" y="744" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace"></text>
<text x="40" y="766" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">## 四、转化方案</text>
<text x="40" y="788" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace"></text>
<text x="40" y="810" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">拟采用「作价入股 + 里程碑许可」的混合模式：</text>
<text x="40" y="832" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace"></text>
<text x="40" y="854" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">- 第一期：以 6 项授权专利作价入股，占新设公司 25% 股权；</text>
<text x="40" y="876" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">- 第二期：产线达产（年产能 100 MW）后，追加工艺包独占许可；</text>
<text x="40" y="898" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">- 校方收益：股权 + 销售额 3% 的里程碑提成，上限 8000 万元。</text>
<text x="40" y="920" font-size="13" fill="#222222" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace"></text>
</svg>
