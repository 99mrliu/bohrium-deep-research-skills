<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" font-family="'Courier New','Noto Sans Mono','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',monospace">
<rect x="0" y="0" width="794" height="1123" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
<text x="72" y="111" font-size="20" fill="#000000" font-weight="bold">结果与讨论</text>
<text x="72" y="155" font-size="16" fill="#000000" font-weight="bold">结果</text>
<text x="72" y="192" font-size="14" fill="#000000" font-weight="bold">催化活性评价</text>
<text x="72" y="215" font-size="12" fill="#000000">如图1所示, 合成催化剂 Cat-A 在 250–400 °C 区间内的 CO 转化率随温度升高单调上升, 在 350 °C 时达到 92.4% 的峰</text>
<text x="72" y="233" font-size="12" fill="#000000">值; 继续升温至 400 °C 后转化率小幅回落至 89.1%, 可能与高温烧结导致的活性位点减少有关。</text>
<text x="397" y="259" font-size="11" fill="#000000" font-weight="bold" text-anchor="middle">图1. Cat-A 在 250–400 °C 的 CO 转化率曲线(n=3, 误差棒为标准差; 空速 30000 h⁻¹)。</text>
<text x="72" y="285" font-size="12" fill="#000000">各样品的织构性质与关键活性数据汇总于表1。Cat-A 的比表面积为 128 m²/g, 显著高于参比样品 Cat-B 的 74 m²/g, 与</text>
<text x="72" y="303" font-size="12" fill="#000000">其更高的低温活性一致。</text>
<text x="397" y="329" font-size="11" fill="#000000" font-weight="bold" text-anchor="middle">表1. 各样品比表面积、平均粒径与 300 °C 转化率汇总(n=3, 转化率误差为标准差)。</text>
<rect x="72" y="346" width="65" height="24" fill="none" stroke="#444444" stroke-width="1"/>
<text x="76" y="364" font-size="11" fill="#000000" font-weight="bold">样品</text>
<rect x="137" y="346" width="195" height="24" fill="none" stroke="#444444" stroke-width="1"/>
<text x="141" y="364" font-size="11" fill="#000000" font-weight="bold">比表面积 (m²/g)</text>
<rect x="332" y="346" width="169" height="24" fill="none" stroke="#444444" stroke-width="1"/>
<text x="336" y="364" font-size="11" fill="#000000" font-weight="bold">平均粒径 (nm)</text>
<rect x="501" y="346" width="221" height="24" fill="none" stroke="#444444" stroke-width="1"/>
<text x="505" y="364" font-size="11" fill="#000000" font-weight="bold">300 °C 转化率 (%)</text>
<rect x="72" y="370" width="65" height="24" fill="none" stroke="#444444" stroke-width="1"/>
<text x="76" y="388" font-size="11" fill="#000000">Cat-A</text>
<rect x="137" y="370" width="195" height="24" fill="none" stroke="#444444" stroke-width="1"/>
<text x="141" y="388" font-size="11" fill="#000000">128</text>
<rect x="332" y="370" width="169" height="24" fill="none" stroke="#444444" stroke-width="1"/>
<text x="336" y="388" font-size="11" fill="#000000">4.2</text>
<rect x="501" y="370" width="221" height="24" fill="none" stroke="#444444" stroke-width="1"/>
<text x="505" y="388" font-size="11" fill="#000000">78.5</text>
<rect x="72" y="394" width="65" height="24" fill="none" stroke="#444444" stroke-width="1"/>
<text x="76" y="412" font-size="11" fill="#000000">Cat-B</text>
<rect x="137" y="394" width="195" height="24" fill="none" stroke="#444444" stroke-width="1"/>
<text x="141" y="412" font-size="11" fill="#000000">74</text>
<rect x="332" y="394" width="169" height="24" fill="none" stroke="#444444" stroke-width="1"/>
<text x="336" y="412" font-size="11" fill="#000000">9.8</text>
<rect x="501" y="394" width="221" height="24" fill="none" stroke="#444444" stroke-width="1"/>
<text x="505" y="412" font-size="11" fill="#000000">41.3</text>
<rect x="72" y="418" width="65" height="24" fill="none" stroke="#444444" stroke-width="1"/>
<text x="76" y="436" font-size="11" fill="#000000">Cat-C</text>
<rect x="137" y="418" width="195" height="24" fill="none" stroke="#444444" stroke-width="1"/>
<text x="141" y="436" font-size="11" fill="#000000">102</text>
<rect x="332" y="418" width="169" height="24" fill="none" stroke="#444444" stroke-width="1"/>
<text x="336" y="436" font-size="11" fill="#000000">6.1</text>
<rect x="501" y="418" width="221" height="24" fill="none" stroke="#444444" stroke-width="1"/>
<text x="505" y="436" font-size="11" fill="#000000">63.0</text>
<text x="72" y="463" font-size="12" fill="#000000">为进一步区分本征活性差异, 对 Cat-A 与 Cat-C 进行了动力学测量, 拟合结果见图2。Cat-A 的表观活化能为 68.2 kJ/mo</text>
<text x="72" y="481" font-size="12" fill="#000000">l, 低于 Cat-C 的 81.5 kJ/mol, 表明其速率控制步骤的能垒更低。</text>
<text x="397" y="507" font-size="11" fill="#000000" font-weight="bold" text-anchor="middle">图2. Cat-A 与 Cat-C 的 Arrhenius 拟合(250–300 °C, 转化率 &lt;15% 的微分区; R² &gt; 0.99)。</text>
<text x="72" y="551" font-size="16" fill="#000000" font-weight="bold">讨论</text>
<text x="72" y="575" font-size="12" fill="#000000">图1 所示的高温段活性回落与 原位 XRD 观察到的晶粒长大现象相互印证, 提示烧结是 400 °C 处失活的主导因素。样品间</text>
<text x="72" y="593" font-size="12" fill="#000000">比表面积与低温活性的正相关关系进一步说明, 分散度是本体系活性的主要描述符; 但 Cat-C 在比表面积居中时仍表现出</text>
<text x="72" y="611" font-size="12" fill="#000000">接近 Cat-A 的 300 °C 转化率, 说明粒径并非唯一变量。</text>
<text x="72" y="635" font-size="12" fill="#000000">图2 的活化能差异(约 13 kJ/mol)与文献中同类贵金属催化剂的报道区间一致, 支持&quot;界面位点为本征活性中心&quot;的假设。</text>
<text x="72" y="677" font-size="16" fill="#000000" font-weight="bold">局限</text>
<text x="72" y="701" font-size="12" fill="#000000">本工作动力学数据仅在转化率 &lt;15% 的微分区采集, 外推至工业高空速条件存在不确定性; 此外 n=3 的重复次数对小效应</text>
<text x="72" y="719" font-size="12" fill="#000000">量的统计分辨能力有限。</text>
<text x="72" y="761" font-size="16" fill="#000000" font-weight="bold">结论</text>
<text x="72" y="785" font-size="12" fill="#000000">Cat-A 在 250–350 °C 区间表现出最优的 CO 氧化活性, 其优势可归因于更高的分散度与更低的表观活化能(图1、图2)。后</text>
<text x="72" y="803" font-size="12" fill="#000000">续工作将围绕抗烧结改性与长时稳定性展开。</text>
<text x="397" y="1095" font-size="10" fill="#666666" text-anchor="middle">- 1 -</text>
</svg>
