<line x1="490" y1="196" x2="806" y2="196" stroke="#888" stroke-dasharray="4 3" marker-end="url(#arr)"/>
<rect x="24" y="24" width="300" height="96" rx="8" fill="white" stroke="#2b6cb0" stroke-width="2"/>
<text x="32" y="44" fill="#2b6cb0" font-weight="bold">[节] SEC01</text>
<text x="32" y="66" fill="#333">生物炭吸附水体磷酸盐的性能研究（合成示例稿件）</text>
<rect x="340" y="24" width="300" height="96" rx="8" fill="white" stroke="#2b6cb0" stroke-width="2"/>
<text x="348" y="44" fill="#2b6cb0" font-weight="bold">[节] SEC02</text>
<text x="348" y="66" fill="#333">引言</text>
<rect x="656" y="24" width="300" height="96" rx="8" fill="white" stroke="#2b6cb0" stroke-width="2"/>
<text x="664" y="44" fill="#2b6cb0" font-weight="bold">[节] SEC03</text>
<text x="664" y="66" fill="#333">材料与方法</text>
<rect x="972" y="24" width="300" height="96" rx="8" fill="white" stroke="#2b6cb0" stroke-width="2"/>
<text x="980" y="44" fill="#2b6cb0" font-weight="bold">[节] SEC04</text>
<text x="980" y="66" fill="#333">结果</text>
<rect x="24" y="148" width="300" height="96" rx="8" fill="white" stroke="#2f855a" stroke-width="2"/>
<text x="32" y="168" fill="#2f855a" font-weight="bold">[证据] N005</text>
<text x="32" y="190" fill="#333">吸附 120 min 后去除率达 87%。</text>
<rect x="340" y="148" width="300" height="96" rx="8" fill="white" stroke="#2f855a" stroke-width="2"/>
<text x="348" y="168" fill="#2f855a" font-weight="bold">[证据] N006</text>
<text x="348" y="190" fill="#333">图 1 给出吸附动力学曲线。</text>
<rect x="656" y="148" width="300" height="96" rx="8" fill="white" stroke="#c53030" stroke-width="2"/>
<text x="664" y="168" fill="#c53030" font-weight="bold">[论断] N007</text>
<text x="664" y="190" fill="#333">因此，生物炭是解决湖泊富营养化的关键材料。</text>
<rect x="972" y="148" width="300" height="96" rx="8" fill="white" stroke="#2b6cb0" stroke-width="2"/>
<text x="980" y="168" fill="#2b6cb0" font-weight="bold">[节] SEC05</text>
<text x="980" y="190" fill="#333">结论</text>
<text x="24" y="288" fill="#666">虚线边框 = 可视化判定的孤立论断（无就近证据），supports? 边为近似，需人工复核</text>
