<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1000" viewBox="0 0 760 1000" role="img" aria-labelledby="title desc">
  <title id="title">SYNTHETIC original page fixture for QV-7 and ZT-3</title>
  <desc id="desc">A fictional two-column page with Aurora Leaf panels A and B and a fictional table. This is a text SVG stand-in, not a real paper or rendered PDF.</desc>
  <rect width="760" height="1000" fill="#fffef8"/>
  <text x="40" y="35" font-family="sans-serif" font-size="20" font-weight="bold" fill="#9b2c00">SYNTHETIC — NOT A REAL PAPER</text>
  <text x="40" y="60" font-family="serif" font-size="15">Fictional Aurora Leaf assay · printed page S-1 · PDF index 0</text>

  <rect x="40" y="80" width="665" height="330" fill="none" stroke="#222"/>
  <rect x="55" y="105" width="305" height="285" fill="#e9f3ef" stroke="#477"/>
  <rect x="400" y="105" width="290" height="285" fill="#fff0dc" stroke="#a60"/>
  <text x="70" y="135" font-family="sans-serif" font-size="24" font-weight="bold">A · Control</text>
  <path d="M170 330 C130 270 140 190 205 165 C265 220 250 295 170 330 Z" fill="#66a38e"/>
  <path d="M168 330 L198 205" stroke="#285d4a" stroke-width="4"/>
  <text x="415" y="135" font-family="sans-serif" font-size="24" font-weight="bold">B · Intervention</text>
  <path d="M530 335 C470 265 490 170 570 150 C645 220 625 305 530 335 Z" fill="#e8a34c"/>
  <path d="M530 335 L568 188" stroke="#95500b" stroke-width="4"/>
  <text x="55" y="405" font-family="serif" font-size="13">Figure QV-7 (fictional): A control; B intervention; individual intervention measurement 23 arbitrary units.</text>

  <text x="40" y="460" font-family="sans-serif" font-size="16" font-weight="bold">Body paragraph (left column)</text>
  <text x="40" y="485" font-family="serif" font-size="14">Panel B is the intervention condition,</text>
  <text x="40" y="507" font-family="serif" font-size="14">whereas panel A is the control. Table ZT-3</text>
  <text x="40" y="529" font-family="serif" font-size="14">summarizes measurements, but the individual</text>
  <text x="40" y="551" font-family="serif" font-size="14">intervention cell value is not reported here.</text>
  <text x="40" y="590" font-family="sans-serif" font-size="13" fill="#9b2c00">READING ORDER UNCERTAIN (SYNTHETIC)</text>

  <text x="390" y="460" font-family="sans-serif" font-size="16" font-weight="bold">Table ZT-3 (fictional)</text>
  <text x="390" y="484" font-family="serif" font-size="13">Aurora Leaf measurements, arbitrary units.</text>
  <rect x="390" y="510" width="315" height="190" fill="#fff" stroke="#222"/>
  <line x1="500" y1="510" x2="500" y2="700" stroke="#222"/>
  <line x1="600" y1="510" x2="600" y2="700" stroke="#222"/>
  <line x1="390" y1="565" x2="705" y2="565" stroke="#222"/>
  <line x1="390" y1="635" x2="705" y2="635" stroke="#222"/>
  <text x="400" y="543" font-family="sans-serif" font-size="13" font-weight="bold">Condition</text>
  <text x="510" y="543" font-family="sans-serif" font-size="13" font-weight="bold">Control</text>
  <text x="610" y="543" font-family="sans-serif" font-size="13" font-weight="bold">Intervention</text>
  <text x="400" y="605" font-family="serif" font-size="14">Control</text>
  <text x="535" y="605" font-family="serif" font-size="14">14</text>
  <text x="635" y="605" font-family="serif" font-size="14">19</text>
  <text x="400" y="670" font-family="serif" font-size="14">Measured</text>
  <rect x="600" y="635" width="105" height="65" fill="#fff3cd" stroke="#d22" stroke-width="2"/>
  <text x="535" y="670" font-family="serif" font-size="14">17</text>
  <text x="635" y="670" font-family="serif" font-size="18" font-weight="bold">23</text>
  <text x="390" y="730" font-family="serif" font-size="12">Caption agreement alone does not prove this red-boxed cell.</text>
  <text x="40" y="960" font-family="sans-serif" font-size="13" fill="#9b2c00">ORIGINAL SYNTHETIC SVG PAGE FIXTURE — NO BINARY PDF IS INCLUDED</text>
</svg>
