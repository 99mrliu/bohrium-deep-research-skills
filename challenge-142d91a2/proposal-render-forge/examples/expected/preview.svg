<text x="20" y="26" font-size="15" font-weight="bold" fill="#222">城市内涝时空预测模型研究——融合雷达定量降水估计与图神经网络的内涝风险预警方法</text>
<text x="20" y="46" font-size="11" fill="#555">水利工程（城市水务与气象交叉） · 博士研究生 · 周期 2027-03 至 2029-02 · 经费 28 万元 · 版本 v1（2026-11-24）</text>
<rect x="20" y="62" width="680" height="96" rx="8" fill="white" stroke="#b9c6d4" stroke-width="1.5"/>
<text x="32" y="84" font-size="13" font-weight="bold" fill="#1d4e89">[1] 研究背景与缺口</text>
<text x="32" y="104" font-size="11" fill="#333">近年来极端短历时强降雨频发，城市内涝已成为韧性城市建设的核心威胁之一。以 2021 年郑州“7·20”特</text>
<text x="32" y="119" font-size="11" fill="#333">大暴雨为代表的重大内涝事件表明，面向街区尺度的分钟级内涝预警能力仍存在明显短板，精细化时空预测是内涝防治 …</text>
<text x="32" y="148" font-size="10" fill="#888">段落 3 · 表格 0 · 字数 378</text>
<rect x="20" y="170" width="680" height="96" rx="8" fill="white" stroke="#b9c6d4" stroke-width="1.5"/>
<text x="32" y="192" font-size="13" font-weight="bold" fill="#1d4e89">[2] 问题定义</text>
<text x="32" y="212" font-size="11" fill="#333">研究对象：某南方城市建成区（合成设定）。输入包括雷达 QPE（1 km / 5 min）、87 个地面雨</text>
<text x="32" y="227" font-size="11" fill="#333">量站观测、排水管网拓扑（约 1.2 万节点）、30 m DEM 与 2018–2025 年内涝积水台账（ …</text>
<text x="32" y="256" font-size="10" fill="#888">段落 2 · 表格 0 · 字数 261</text>
<rect x="20" y="278" width="680" height="96" rx="8" fill="white" stroke="#b9c6d4" stroke-width="1.5"/>
<text x="32" y="300" font-size="13" font-weight="bold" fill="#1d4e89">[3] 研究目标</text>
<text x="32" y="320" font-size="11" fill="#333">目标一（数据）：构建覆盖不少于 30 场历史降雨事件的“降雨—管网—积水”耦合数据集，完成积水台账的空间</text>
<text x="32" y="335" font-size="11" fill="#333">配准与质量分级，形成可复用的标注规范。</text>
<text x="32" y="364" font-size="10" fill="#888">段落 3 · 表格 0 · 字数 239</text>
<rect x="20" y="386" width="680" height="96" rx="8" fill="white" stroke="#b9c6d4" stroke-width="1.5"/>
<text x="32" y="408" font-size="13" font-weight="bold" fill="#1d4e89">[4] 技术路线</text>
<text x="32" y="428" font-size="11" fill="#333">技术路线分四层：数据层完成 QPE 误差订正、台账配准与图结构构建 [S2]；模型层以图神经网络聚合管网</text>
<text x="32" y="443" font-size="11" fill="#333">上下游信息、以 ConvLSTM 刻画降雨时空演化，两者通过门控融合 [S3][S4]；物理约束层引入水 …</text>
<text x="32" y="472" font-size="10" fill="#888">段落 2 · 表格 1 · 字数 213</text>
<rect x="20" y="494" width="680" height="252" rx="8" fill="white" stroke="#c97b2d" stroke-width="1.5"/>
<text x="32" y="516" font-size="13" font-weight="bold" fill="#1d4e89">[5] 阶段计划</text>
<text x="32" y="536" font-size="11" fill="#333">研究周期 2027-03 至 2029-02 共 8 个季度，第 4 季度末进行中期检查。计划分解为 6</text>
<text x="32" y="551" font-size="11" fill="#333"> 项任务，起止季度与交付物见表 2；人员配置为博士生 1 名全程负责模型与论文，硕士生 2 名在 T2  …</text>
