<text x="32" y="780" font-size="13" font-weight="bold" fill="#1d4e89">[6] 风险与备选</text>
<text x="32" y="800" font-size="11" fill="#333">风险一（数据）：历史积水台账覆盖不足，可能撑不起模型训练。触发信号：可用降雨事件少于 20 场。备选方案</text>
<text x="32" y="815" font-size="11" fill="#333">：引入相邻城市公开内涝数据，并用 SWMM 仿真样本做数据增广 [S5]。</text>
