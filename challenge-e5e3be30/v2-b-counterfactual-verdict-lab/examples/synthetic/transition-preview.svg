<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="664" viewBox="0 0 1240 664" role="img" aria-labelledby="title desc">
<title id="title">Counterfactual verdict transition report</title>
<desc id="desc">Text preview generated from independent annotation transitions, not prefabricated verdicts.</desc>
<rect width="1240" height="664" fill="#f6f8fc"/>
<text x="28" y="40" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172033">SYNTHETIC minimal-pair transitions</text>
<text x="28" y="70" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#172033">status=consistent  total=6  consistent=6  inconsistent=0</text>
<text x="28" y="98" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#4a5872">Verdicts originate in independent annotations; this SVG only renders the observed report.</text>
